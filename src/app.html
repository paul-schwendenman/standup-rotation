<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Apply the saved theme before first paint; ThemeSelector re-validates custom themes on mount.
			try {
				const theme = localStorage.getItem('theme');
				if (theme) document.documentElement.setAttribute('data-theme', theme);
				const css = localStorage.getItem('customThemesCss');
				if (css) {
					const style = document.createElement('style');
					style.id = 'custom-themes';
					style.textContent = css;
					document.head.appendChild(style);
				}
			} catch {
				// localStorage unavailable; fall back to the default theme
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
